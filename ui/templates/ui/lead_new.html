{% extends "ui/base.html" %}
{% block title %}New lead · LeadDesk{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>New lead</h1>
    <p class="muted small">The AI reads their website and scores the lead in a few seconds.</p>
  </div>
</div>
<form method="post" class="card" style="max-width: 640px">
  {% csrf_token %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(optional)</span>{% endif %}</label>
    {{ field }}
    {{ field.errors }}
  {% endfor %}
  <p class="actions"><button class="primary" type="submit">Create and score</button><a class="button" href="{% url 'ui:board' %}">Cancel</a></p>
</form>
{% endblock %}
