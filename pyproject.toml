[project]
name = "leaddesk"
version = "0.1.0"
description = "Lead CRM API in Django + DRF with AI lead scoring through an n8n MCP server"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=5.2,<6",
    "django-filter>=26.1",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "mcp>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
# WhiteNoise warns when collectstatic hasn't run, which only happens in the Docker image
filterwarnings = ["ignore:No directory at:UserWarning"]
